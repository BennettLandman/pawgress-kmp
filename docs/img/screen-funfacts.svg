o,Helvetica,Arial,sans-serif" font-size="13" fill="#2A322E" text-anchor="start" font-weight="500" opacity="1">Four days running now.</text><text x="161" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#2A322E" text-anchor="start" font-weight="500" opacity="1">That is what steady</text><text x="161" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#2A322E" text-anchor="start" font-weight="500" opacity="1">looks like.</text><text x="20" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">Just for fun — your coach's line is picked at</text><text x="20" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">random and isn't training advice.</text><rect x="16" y="370" width="358" height="78" rx="14" fill="#E7E1ED" stroke="#D3DDD6" stroke-width="1"/><text x="32" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#2A322E" text-anchor="start" font-weight="600" opacity="1">4 day streak</text><text x="32" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">Consecutive gym days with at least one lift logged.</text><rect x="16" y="462" width="358" height="70" rx="14" fill="#FFFFFF" stroke="#D3DDD6" stroke-width="1"/><text x="32" y="492" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#2A322E" text-anchor="start" font-weight="600" opacity="1">12 lifts</text><text x="32" y="513" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">That's 12 confirmed lifts this week.</text><rect x="16" y="542" width="358" height="70" rx="14" fill="#FFFFFF" stroke="#D3DDD6" stroke-width="1"/><text x="32" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#2A322E" text-anchor="start" font-weight="600" opacity="1">Chest Press</text><text x="32" y="593" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">Logged 3 times — your favorite this week.</text><rect x="16" y="622" width="358" height="70" rx="14" fill="#FFFFFF" stroke="#D3DDD6" stroke-width="1"/><text x="32" y="652" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#2A322E" text-anchor="start" font-weight="600" opacity="1">4,180 lb</text><text x="32" y="673" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#4C574F" text-anchor="start" font-weight="400" opacity="1">Total weight moved this week.</text><rect x="0.6" y="0.6" width="388.8" height="842.8" rx="30" fill="none" stroke="#D3DDD6" stroke-width="1.2"/><rect x="137.0" y="830" width="116" height="4.5" rx="2.3" fill="#7C8880" opacity="0.5"/></svg>